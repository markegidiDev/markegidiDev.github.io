<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,follow" />
    <title>Page not found | Marco Egidi</title>
    <script>
      (function (location) {
        var path = location.pathname;
        var query = location.search ? location.search.slice(1) : "";
        var target =
          "/?p=" +
          encodeURIComponent(path) +
          (query ? "&q=" + encodeURIComponent(query) : "") +
          location.hash;
        location.replace(target);
      })(window.location);
    </script>
    <style>
      body {
        margin: 0;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 1.5rem;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      a {
        color: #34d399;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>Redirecting to the portfolio…</p>
      <p><a href="/">Return to Marco Egidi’s homepage</a></p>
    </main>
  </body>
</html>
